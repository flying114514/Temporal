services:
  temporal:
    image: temporalio/auto-setup:1.25.1
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=sqlite
  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
